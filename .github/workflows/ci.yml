name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --extra dev --no-build
          echo "PYTHONPATH=$PWD/src" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Test engine imports
        run: |
          python -c "from qwed_mcp.engines.math_engine import verify_math_expression; print('Math engine OK')"
          python -c "from qwed_mcp.engines.logic_engine import verify_logic_statement; print('Logic engine OK')"
          python -c "from qwed_mcp.engines.code_engine import verify_code_safety; print('Code engine OK')"
          python -c "from qwed_mcp.engines.sql_engine import verify_sql_query; print('SQL engine OK')"

      - name: Test security imports
        run: |
          python -c "from qwed_mcp.security import SkillProvenanceGuard; print('SkillProvenanceGuard OK')"

      - name: Test basic verification
        run: |
          python -c "
          from qwed_mcp.engines.math_engine import verify_math_expression
          result = verify_math_expression('x**2', '2*x', 'derivative')
          assert result['verified'], 'Math verification failed'
          print('✅ Math verification passed')
          "

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Install linters
        run: |
          uv tool install black==24.10.0 --no-build
          uv tool install ruff==0.6.9 --no-build

      - name: Check formatting with Black
        run: |
          black --check src/ || echo "Formatting check failed (non-blocking)"

      - name: Lint with Ruff
        run: |
          ruff check src/ || echo "Lint check failed (non-blocking)"

  boundary:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: QWED Boundary Check
        run: |
          python scripts/check_boundary.py
