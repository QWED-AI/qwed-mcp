name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  ci:
    # The full CI workflow (tests on every supported Python, lint and the
    # boundary check) must pass before anything is published (#14).
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip==24.2 --only-binary :all:
          pip install build==1.2.1 --only-binary :all:
      
      - name: Build package
        run: python -m build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3