[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwed-mcp"
version = "0.2.3"
description = "MCP Server for QWED Verification - Use QWED verification tools in Claude Desktop, VS Code, and any MCP client"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Rahul Dass", email = "rahul@qwedai.tech"}
]
keywords = ["mcp", "model-context-protocol", "verification", "llm", "anthropic", "claude", "qwed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    # Imported by qwed_mcp.tools (#64).
    "anyio>=4.5,<5",
    "mcp>=1.30.0,<2",
    "sympy>=1.12",
    "z3-solver>=4.12.0.0",
    "sentry-sdk>=2.13.0",
    # Not imported by qwed-mcp: mcp depends on PyJWT[crypto] with lower
    # floors, and these raise them to releases with the security fixes.
    # Removing them would not remove the packages, only the floors (#44).
    "cryptography>=46.0.5",
    "PyJWT>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/QWED-AI/qwed-mcp"
Documentation = "https://docs.qwedai.tech/mcp/overview"
Repository = "https://github.com/QWED-AI/qwed-mcp"

[project.scripts]
qwed-mcp = "qwed_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
